name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from gradle.properties
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Update README version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/ability-api:[0-9][0-9.]*[0-9]/ability-api:$VERSION/g" README.md
          sed -i "s|<version>[0-9][0-9.]*[0-9]</version>|<version>$VERSION</version>|g" README.md

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update import version to ${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
